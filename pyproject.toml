[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-galactic-structures"
version = "0.1.0"
description = "Scientifically grounded 3D model and data pipeline for the Solar neighborhood (Gould Belt, Radcliffe Wave, Local Bubble)."
requires-python = ">=3.12"
dependencies = [
    "astropy>=6.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/local_galactic_structures"]

[tool.pytest.ini_options]
testpaths = ["tests"]
